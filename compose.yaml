services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file: .env.postgres
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - nexus_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  nexus_postgres:
